services:
  - type: web
    name: bom-tan
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Google sign-in (optional): paste the OAuth client id in the dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      # signs login sessions; generated once so sessions survive restarts
      - key: SESSION_SECRET
        generateValue: true
